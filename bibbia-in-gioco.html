<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibbia in Gioco</title>
<style>
  :root{
    --night-1:#0A0C16;
    --night-2:#1B2036;
    --night-3:#10121F;
    --sandstone:#F5F0E5;
    --sandstone-edge:#E4DAC5;
    --ink:#211A12;
    --ink-soft:#6B5D48;
    --gold:#ECAC49;
    --gold-deep:#C4832A;
    --parchment:#F3EEE4;
    --wrong:#E15B58;
    --right:#46AE7C;
    --radius:20px;
    --team-1:#ECAC49;
    --team-2:#33ABA0;
    --team-3:#E15B58;
    --team-4:#9D7FE0;
    --team-5:#6FBE63;
    --team-6:#4FA3E0;

    --shadow-card:0 1px 1px rgba(0,0,0,.04), 0 24px 48px -16px rgba(0,0,0,.55), 0 4px 12px -4px rgba(0,0,0,.25);
    --shadow-btn:0 10px 22px -8px rgba(236,172,73,.55), inset 0 1px 0 rgba(255,255,255,.4);
    --ease:cubic-bezier(.22,1,.36,1);

    /* scala tipografica unica: usata ovunque, niente taglie improvvisate */
    --fs-xs:11px; --fs-sm:13px; --fs-base:15px; --fs-md:17px; --fs-lg:21px; --fs-xl:27px;
    /* scala spaziature unica */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
    /* raggi: 3 soli valori in tutta l'app */
    --r-sm:12px; --r-lg:20px; --r-full:999px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:var(--parchment);
    background:
      radial-gradient(ellipse 900px 520px at 12% -8%, rgba(236,172,73,.12), transparent 60%),
      radial-gradient(ellipse 760px 520px at 105% 4%, rgba(79,163,224,.09), transparent 58%),
      radial-gradient(ellipse 640px 420px at 50% 110%, rgba(157,127,224,.06), transparent 55%),
      linear-gradient(180deg, var(--night-1), var(--night-2) 55%, var(--night-3));
    background-attachment:fixed;
    padding:0 var(--sp-4) var(--sp-6);
  }

  .wrap{max-width:520px;margin:0 auto;}

  /* ---- barra persistente minimale: non compete col contenuto ---- */
  .brand{
    text-align:center;
    padding:var(--sp-3) 0;
    margin-bottom:var(--sp-4);
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .brand .eyebrow{
    display:none; /* l'occhiello duplicava il sottotitolo senza aggiungere informazione */
  }
  .brand h1{
    font-size:var(--fs-md);
    margin:0;
    font-weight:800;
    letter-spacing:-.01em;
    line-height:1.2;
    color:var(--gold);
  }
  .brand p{
    margin:3px 0 0;
    font-size:var(--fs-xs);
    color:var(--parchment);
    opacity:.5;
    font-weight:500;
  }
  .site-footer{
    max-width:520px;
    margin:var(--sp-6) auto 0;
    padding-top:var(--sp-4);
    border-top:1px solid rgba(245,240,229,.10);
    text-align:center;
  }
  .site-footer a{
    display:inline-block;
    padding:6px 10px;
    font-size:var(--fs-sm);
    color:rgba(245,240,229,.55);
    text-decoration:none;
    border-radius:var(--r-full);
    transition:color .15s var(--ease), background .15s var(--ease);
  }
  .site-footer a:hover,
  .site-footer a:focus-visible{
    color:var(--gold);
    background:rgba(236,172,73,.10);
  }

  .version-tag{
    position:fixed;
    bottom:6px;
    left:8px;
    font-size:10px;
    opacity:.3;
    letter-spacing:.04em;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--parchment);
    z-index:5;
    pointer-events:none;
  }

  /* ---- card, la superficie ricorrente ---- */
  .tablet{
    background:var(--sandstone);
    color:var(--ink);
    border-radius:var(--r-lg);
    border:1px solid var(--sandstone-edge);
    box-shadow:var(--shadow-card);
    padding:var(--sp-5) var(--sp-4);
    position:relative;
  }
  .tablet + .tablet{margin-top:var(--sp-3);}
  @keyframes card-in{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* separatore leggero per raggruppare sezioni dentro la stessa card
     (es. impostazioni partita vs. elenco squadre) */
  .section-divider{
    border:none;border-top:1px solid var(--sandstone-edge);
    margin:var(--sp-4) 0 var(--sp-4);
  }

  label.field-label{
    display:block;
    font-size:var(--fs-xs);
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:800;
    color:var(--ink-soft);
    margin-bottom:var(--sp-2);
  }

  /* ---- stepper ---- */
  .stepper{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-4);}
  .stepper button{
    width:36px;height:36px;border-radius:50%;
    border:none;background:linear-gradient(180deg,#F4C374,var(--gold));color:var(--ink);
    font-size:var(--fs-md);font-weight:800;cursor:pointer;
    box-shadow:0 4px 10px -3px rgba(196,131,42,.5);
    transition:transform .12s var(--ease);
  }
  .stepper button:active{background:var(--gold-deep);transform:scale(.92);}
  .stepper .count{font-size:var(--fs-lg);font-weight:800;min-width:26px;text-align:center;font-variant-numeric:tabular-nums;}

  /* ---- righe squadra ---- */
  .team-row{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2);flex-wrap:wrap;}
  .team-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px rgba(0,0,0,.05);}
  .team-row input{
    flex:1 1 120px;
    padding:11px var(--sp-3);
    border-radius:var(--r-sm);
    border:1.5px solid var(--sandstone-edge);
    background:#FFFDF9;
    color:var(--ink);
    font-size:var(--fs-base);
    min-width:0;
    transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .team-row input:focus-visible{outline:none;border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(196,131,42,.18);}
  .diff-select{
    flex:0 0 auto;
    padding:9px 10px;
    border-radius:var(--r-sm);
    border:1.5px solid var(--sandstone-edge);
    background:#FFFDF9;
    color:var(--ink);
    font-size:var(--fs-sm);
    font-weight:700;
    max-width:118px;
  }
  .diff-select:focus-visible{outline:none;border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(196,131,42,.18);}

  /* ---- pillole scelta (difficoltà) ---- */
  .pill-group{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-4);}
  .pill{
    padding:9px 15px;border-radius:var(--r-full);
    border:1.5px solid var(--sandstone-edge);
    background:transparent;color:var(--ink);
    font-size:var(--fs-sm);font-weight:700;cursor:pointer;
    transition:all .15s var(--ease);
  }
  .pill.selected{background:var(--ink);color:var(--sandstone);border-color:var(--ink);}

  .check-row{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2);font-size:var(--fs-base);font-weight:500;}
  .check-row input{width:19px;height:19px;accent-color:var(--gold-deep);}
  .warn{color:var(--wrong);font-size:var(--fs-sm);margin-top:2px;margin-bottom:var(--sp-2);font-weight:600;}

  /* ---- bottoni: un solo linguaggio in tutta l'app ----
     pieno = azione primaria | contornato chiaro = secondaria | contornato scuro = terziaria/annulla */
  .btn{
    display:block;width:100%;
    padding:16px var(--sp-4);
    border-radius:var(--r-full);border:none;
    font-size:var(--fs-md);font-weight:800;
    cursor:pointer;
    text-align:center;
    letter-spacing:-.005em;
    transition:transform .12s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), opacity .15s var(--ease);
  }
  .btn-primary{background:linear-gradient(180deg,#F4C374,var(--gold) 55%,var(--gold-deep));color:var(--ink);box-shadow:var(--shadow-btn);}
  .btn-primary:active{transform:scale(.975);box-shadow:0 4px 12px -6px rgba(196,131,42,.6), inset 0 1px 0 rgba(255,255,255,.3);}
  .btn-primary[data-action="pick-mode"]{padding:19px var(--sp-4);line-height:1.55;}
  .btn-secondary{background:rgba(43,32,19,.06);color:var(--ink);border:1.5px solid var(--sandstone-edge);margin-top:var(--sp-3);}
  .btn-secondary:active{transform:scale(.975);background:rgba(43,32,19,.1);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--sandstone-edge);margin-top:var(--sp-2);font-weight:700;}
  .btn-ghost:active{transform:scale(.975);background:rgba(43,32,19,.05);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn:focus-visible, .pill:focus-visible, .check-row input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---- striscia punteggi: lo stato attivo deve leggersi in zero secondi ---- */
  .scoreboard{display:flex;gap:var(--sp-2);overflow-x:auto;padding-bottom:2px;margin-bottom:var(--sp-4);-webkit-overflow-scrolling:touch;}
  .team-pill{
    flex:0 0 auto;
    display:flex;align-items:center;gap:7px;
    padding:8px var(--sp-3);border-radius:var(--r-full);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    font-size:var(--fs-sm);font-weight:600;white-space:nowrap;
    color:rgba(243,238,228,.55);
    transition:all .2s var(--ease);
  }
  .team-pill b{font-variant-numeric:tabular-nums;color:rgba(243,238,228,.8);font-weight:700;}
  .team-pill-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.15);}
  .team-pill.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink);
    font-weight:800;
    box-shadow:0 6px 16px -4px rgba(236,172,73,.55);
    transform:translateY(-1px);
  }
  .team-pill.active b{color:var(--ink);}
  .team-pill.active .team-pill-dot{box-shadow:0 0 0 2px rgba(33,26,18,.25);}

  .turn-banner{text-align:center;margin-bottom:var(--sp-3);}
  .turn-banner .eyebrow{
    font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;
    color:var(--parchment);opacity:.5;font-weight:700;
  }
  .turn-banner .team-name{
    font-size:var(--fs-xl);font-weight:800;letter-spacing:-.01em;color:var(--gold);
  }

  /* ---- badge: solo per classificare (tipo/livello), mai per dati che cambiano spesso ---- */
  .badges{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap;}
  .badge{
    font-size:var(--fs-xs);letter-spacing:.04em;font-weight:800;
    padding:6px 12px;border-radius:var(--r-full);
    background:rgba(43,32,19,.07);color:var(--ink-soft);
    border:1px solid rgba(43,32,19,.1);
  }
  .progress-note{
    font-size:var(--fs-xs);color:var(--ink-soft);opacity:.7;font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  .q-text{font-size:var(--fs-md);line-height:1.44;font-weight:700;margin:var(--sp-1) 0 var(--sp-4);letter-spacing:-.01em;}
  .clue-count{font-size:var(--fs-sm);color:var(--ink-soft);margin-bottom:var(--sp-2);font-weight:600;}

  .option{
    display:flex;align-items:center;gap:11px;
    width:100%;text-align:left;
    padding:14px 15px;margin-bottom:var(--sp-2);
    border-radius:var(--r-sm);border:1.5px solid var(--sandstone-edge);
    background:#FFFDF9;color:var(--ink);
    font-size:var(--fs-base);font-weight:500;cursor:pointer;
    transition:all .15s var(--ease);
  }
  .option:not(:disabled):hover{border-color:var(--gold-deep);}
  .option .letter{
    width:25px;height:25px;border-radius:50%;
    background:var(--ink);color:var(--sandstone);
    font-size:var(--fs-xs);font-weight:800;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    transition:background .15s var(--ease);
  }
  .option.correct{background:#E3F5E9;border-color:var(--right);}
  .option.correct .letter{background:var(--right);}
  .option.wrong{background:#FBE7E6;border-color:var(--wrong);}
  .option.wrong .letter{background:var(--wrong);}
  .option:disabled{cursor:default;}
  .option:not(:disabled):active{transform:scale(.98);}

  /* variante non interattiva: stesso aspetto, ma senza hover/pressione (es. indizi mostrati e basta) */
  .option-static{
    display:flex;align-items:center;gap:11px;
    width:100%;text-align:left;
    padding:14px 15px;margin-bottom:var(--sp-2);
    border-radius:var(--r-sm);border:1.5px solid var(--sandstone-edge);
    background:#FFFDF9;color:var(--ink);
    font-size:var(--fs-base);font-weight:500;
  }
  .option-static .letter{
    width:25px;height:25px;border-radius:50%;
    background:var(--ink);color:var(--sandstone);
    font-size:var(--fs-xs);font-weight:800;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .option-static.wrong{background:#FBE7E6;border-color:var(--wrong);}
  .option-static.wrong .letter{background:var(--wrong);}

  .reveal-box{
    margin-top:var(--sp-4);padding:15px var(--sp-4);border-radius:var(--r-sm);
    background:rgba(43,32,19,.05);border:1px dashed var(--sandstone-edge);
    font-size:var(--fs-base);line-height:1.55;
    animation:card-in .3s var(--ease);
  }
  .reveal-box .verdict{font-weight:800;font-size:var(--fs-md);margin-bottom:4px;letter-spacing:-.01em;}
  .reveal-box .verdict.right-v{color:var(--right);}
  .reveal-box .verdict.wrong-v{color:var(--wrong);}
  .reveal-box .ref{color:var(--ink-soft);font-style:italic;}

  /* ---- medaglione del verdetto, l'unico elemento "vistoso" dell'app ---- */
  .seal-wrap{display:flex;justify-content:center;margin:var(--sp-2) 0 var(--sp-2);}
  .seal{
    width:72px;height:72px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;color:#fff;
    box-shadow:0 10px 24px -6px rgba(0,0,0,.4), inset 0 -8px 14px rgba(0,0,0,.18), inset 0 3px 6px rgba(255,255,255,.35);
    animation: seal-stamp .5s var(--ease);
  }
  .seal.right-s{background:radial-gradient(circle at 35% 28%, #6FD69B, var(--right));}
  .seal.wrong-s{background:radial-gradient(circle at 35% 28%, #F08A87, var(--wrong));}
  @keyframes seal-stamp{
    0%{transform:scale(.3);opacity:0;}
    55%{transform:scale(1.12);opacity:1;}
    75%{transform:scale(.95);}
    100%{transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .seal{animation:none;}
    .reveal-box{animation:none;}
  }

  .actions-row{display:flex;gap:var(--sp-3);margin-top:6px;}
  .actions-row .btn{margin-top:0;}

  .peek-toggle{
    display:inline-flex;align-items:center;gap:6px;
    background:transparent;border:1.5px dashed var(--ink-soft);
    color:var(--ink-soft);font-size:var(--fs-sm);font-weight:700;
    padding:7px var(--sp-3);border-radius:var(--r-full);cursor:pointer;margin-bottom:var(--sp-4);
    transition:all .15s var(--ease);
  }
  .peek-toggle:active{background:rgba(43,32,19,.07);transform:scale(.97);}
  .peek-panel{
    margin:-6px 0 var(--sp-4);padding:12px 14px;border-radius:var(--r-sm);
    background:rgba(157,127,224,.09);border:1px dashed #9D7FE0;
    font-size:var(--fs-sm);color:var(--ink);line-height:1.5;
    animation:card-in .25s var(--ease);
  }
  .peek-panel b{color:#7A5FC4;}
  .peek-panel .peek-ref{opacity:.7;font-style:italic;}

  .footer-actions{text-align:center;margin-top:var(--sp-4);}
  .timer-wrap{
    display:flex; align-items:center; gap:var(--sp-2); margin-top:var(--sp-4);
    padding:11px 13px; border-radius:var(--r-sm);
    background:rgba(43,32,19,.05); border:1px dashed var(--sandstone-edge);
    transition:all .2s var(--ease);
  }
  .timer-display{font-size:var(--fs-xl);font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);}
  .timer-display.timer-low{color:var(--wrong);}
  .timer-wrap .timer-start-btn{
    display:inline-block;width:auto;
    margin:0 0 0 auto;
    padding:9px 16px;
    font-size:var(--fs-sm);
    background:var(--ink);color:var(--sandstone);
    box-shadow:none;
  }
  .timer-wrap .timer-start-btn:active{transform:scale(.96);background:#3A2E1E;}
  .timer-unit{font-size:var(--fs-xs);color:var(--ink-soft);font-weight:600;}
  .timer-wrap.timer-done{border-color:var(--wrong);background:rgba(225,91,88,.1);border-style:solid;}
  .link-btn{
    background:none;border:none;color:var(--parchment);opacity:.5;
    font-size:var(--fs-sm);text-decoration:underline;cursor:pointer;padding:var(--sp-2);
    transition:opacity .15s var(--ease);
  }
  .link-btn:active{opacity:.85;}
  .link-btn-dark{
    background:none;border:none;color:var(--ink-soft);opacity:.75;
    font-size:var(--fs-sm);text-decoration:underline;cursor:pointer;padding:var(--sp-2);
    transition:opacity .15s var(--ease);
  }
  .link-btn-dark:active{opacity:1;}

  /* ---- classifica finale ---- */
  .rank-row{
    display:flex;align-items:center;gap:var(--sp-3);
    padding:13px 6px;border-bottom:1px solid rgba(43,32,19,.1);
  }
  .rank-row:first-child{
    background:linear-gradient(90deg, rgba(236,172,73,.12), transparent);
    border-radius:var(--r-sm);
    margin:-2px -6px 2px;
    padding:13px var(--sp-3);
  }
  .rank-row:last-child{border-bottom:none;}
  .rank-medal{font-size:var(--fs-lg);width:30px;text-align:center;flex:0 0 auto;}
  .rank-name{flex:1;font-weight:700;font-size:var(--fs-md);}
  .rank-score{font-weight:800;font-size:var(--fs-lg);font-variant-numeric:tabular-nums;color:var(--gold-deep);}

  .empty-note{font-size:var(--fs-base);line-height:1.55;color:var(--ink-soft);margin-bottom:var(--sp-4);}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="eyebrow">Sfida a squadre</span>
    <h1>Bibbia in Gioco</h1>
  </div>
  <div id="app"></div>
</div>

<footer class="site-footer">
  <a href="https://evangelicimaranello.it/privacy-bibbia-in-gioco.html" target="_blank" rel="noopener">Informativa sulla privacy</a>
</footer>

<span class="version-tag">v2.4</span>

<script>
/* =========================================================
   DATA: domande, distinte per tipo e difficoltà
   ========================================================= */
const QUIZ = [
  // FACILI
  {id:'q1',diff:'base',q:"Chi costruì una grande arca per salvarsi dal diluvio?",opts:["Mosè","Noè","Abramo"],correct:1,ref:"Genesi 6-9"},
  {id:'q2',diff:'base',q:"In quanti giorni Dio creò il mondo, prima di riposarsi il settimo giorno?",opts:["3","6","9"],correct:1,ref:"Genesi 1:1 - 2:3"},
  {id:'q3',diff:'base',q:"Come si chiamava il gigante sconfitto da Davide con una fionda?",opts:["Golia","Sansone","Saul"],correct:0,ref:"1 Samuele 17"},
  {id:'q4',diff:'base',q:"Chi vendette Giuseppe come schiavo ai mercanti?",opts:["I suoi fratelli","Suo padre","I Filistei"],correct:0,ref:"Genesi 37"},
  {id:'q5',diff:'facile',q:"In quale città nacque Gesù?",opts:["Nazareth","Gerusalemme","Betlemme"],correct:2,ref:"Luca 2:4-7"},
  {id:'q6',diff:'base',q:"Chi guidò il popolo d'Israele fuori dall'Egitto?",opts:["Mosè","Giosuè","Aronne"],correct:0,ref:"Esodo"},
  {id:'q7',diff:'medio',q:"Quale animale parlò a Balaam lungo la strada?",opts:["Un cammello","Un'asina","Un cavallo"],correct:1,ref:"Numeri 22:28"},
  {id:'q8',diff:'base',q:"Chi fu inghiottito da un grande pesce?",opts:["Giona","Daniele","Elia"],correct:0,ref:"Giona 1-2"},
  {id:'q9',diff:'base',q:"Quanti apostoli scelse Gesù?",opts:["7","10","12"],correct:2,ref:"Vangeli"},
  {id:'q10',diff:'base',q:"Come si chiamava il primo uomo creato da Dio?",opts:["Adamo","Noè","Abramo"],correct:0,ref:"Genesi 2:7"},
  {id:'q11',diff:'base',q:"Come si chiamava la prima donna, moglie di Adamo?",opts:["Eva","Sara","Rut"],correct:0,ref:"Genesi 2:22"},

// Sbircia-risposta per il master, come nella modalita' classica - solo per i giochi dove
// la risposta non e' gia' visibile a schermo (Tabu e Mimare mostrano gia' tutto).
function renderPartyPeek(kind, data){
  if(party.qState.revealed) return '';
  const open = party.qState.peeked;
  let answerText;
  if(kind==='treclues'){
    const shownFalseIndex = party.qState.shuffledFalseIndex !== undefined ? party.qState.shuffledFalseIndex : data.falseIndex;
    answerText = `${data.answer} (indizio falso: n.${shownFalseIndex+1})`;
  }
  else if(kind==='intruso') answerText = data.items[data.oddIndex];
  else if(kind==='errore') answerText = data.correction;
  else return '';
  return `
    <button class="peek-toggle" data-action="party-toggle-peek">👁️ ${open ? 'Nascondi risposta' : 'Sbircia la risposta (solo per te)'}</button>
    ${open ? `<div class="peek-panel">Risposta: <b>${answerText}</b></div>` : ''}
  `;
}

  askedCount:0,
  currentQ:null, // {kind, data}
  qState:{}, // per-question interaction state
  autoEnded:false,
};

// Stato separato per la modalità Party (stessa forma, mini-giochi diversi)
let party = {
  numTeams:3,
  teamNames:['Squadra 1','Squadra 2','Squadra 3','Squadra 4','Squadra 5','Squadra 6'],
  teamDifficulties:['facile','facile','facile','facile','facile','facile'],
  typesEnabled:{taboo:true, charades:true, treclues:true, intruso:true, errore:true},
  questionsPerTeam:10,
  timerSeconds:60, // usato solo da Parola Proibita e Mimare la Bibbia

  teams:[],
  currentTeamIndex:0,
  usedTopics:new Set(),
  askedCount:0,
  currentQ:null,
  qState:{},
  autoEnded:false,
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildTypePools(diff){
  const match = (x) => x.diff === diff;
  return {
    quiz: shuffle(QUIZ.filter(match).map(x=>({kind:'quiz',data:x}))),
    vf: shuffle(VF.filter(match).map(x=>({kind:'vf',data:x}))),
    indovina: shuffle(INDOVINA.filter(match).map(x=>({kind:'indovina',data:x}))),
  };
}

// Costruisce, per l'intera partita di una squadra, una sequenza di tipi di domanda
// con conteggi il più possibile uguali (es. 10 domande, 3 tipi -> 4/3/3), poi la mescola
// così l'ordine resta imprevedibile ma il totale per tipo è garantito.
function buildTypeSequence(n, enabledTypes){
  if(enabledTypes.length === 0) return [];
  const k = enabledTypes.length;
  const base = Math.floor(n / k);
  const rem = n % k;
  let seq = [];
  enabledTypes.forEach((t, idx) => {
    const count = base + (idx < rem ? 1 : 0);
    for(let i=0; i<count; i++) seq.push(t);
  });
  return shuffle(seq);
}

function startGame(){
  state.teams = [];
  const enabledTypes = ['quiz','vf','indovina'].filter(t => state.typesEnabled[t]);
  for(let i=0;i<state.numTeams;i++){
    const name = (state.teamNames[i] || '').trim() || ('Squadra '+(i+1));
    const diff = state.teamDifficulties[i] || 'facile';
    state.teams.push({
      name, score:0, color:TEAM_COLORS[i], difficulty:diff, asked:0,
      pools: buildTypePools(diff),
      typeSequence: buildTypeSequence(state.questionsPerTeam, enabledTypes),
    });
  }
  state.currentTeamIndex = 0;
  state.usedTopics = new Set();
  state.askedCount = 0;
  state.autoEnded = false;
  state.screen = 'game';
  pickNextQuestion();
}

function popUnusedTopic(pool){
  while(pool && pool.length > 0){
    const candidate = pool.pop();
    const topic = topicOf(candidate.data);
    if(state.usedTopics.has(topic)) continue; // stesso fatto già chiesto in un altro formato: salta
    state.usedTopics.add(topic);
    return candidate;
  }
  return null;
}

function pickNextQuestion(){
  state.qState = {revealed:false, selected:null, clueIndex:0, peeked:false};
  const team = state.teams[state.currentTeamIndex];
  const wantType = team.typeSequence[team.asked]; // tipo previsto per questa posizione, uguale per tutte le squadre
  let picked = null;

  if(wantType){
    picked = popUnusedTopic(team.pools[wantType]);
  }
  if(!picked){
    // Il tipo previsto è esaurito per questo livello: ripieghiamo su un altro tipo abilitato
    // pur di non interrompere la partita (evento raro con mazzi di questa dimensione).
    for(const t of ['quiz','vf','indovina']){
      if(t === wantType || !state.typesEnabled[t]) continue;
      picked = popUnusedTopic(team.pools[t]);
      if(picked) break;
    }
  }

  if(picked){
    state.currentQ = picked;
    state.askedCount++;
    team.asked = (team.asked||0) + 1;
  } else {
    state.currentQ = null;
  }
  render();
}

function reshufflePool(){
  const team = state.teams[state.currentTeamIndex];
  // Libera solo gli argomenti di QUESTO livello di difficoltà, per non far ripetere
  // domande già fatte alle altre squadre su livelli diversi.
  [QUIZ,VF,INDOVINA].forEach(arr=>{
    arr.filter(x=>x.diff===team.difficulty).forEach(x=>state.usedTopics.delete(topicOf(x)));
  });
  team.pools = buildTypePools(team.difficulty);
  pickNextQuestion();
}

function advanceTurn(){
  const allDone = state.teams.every(t => (t.asked||0) >= state.questionsPerTeam);
  if(allDone){
    state.autoEnded = true;
    endGame();
    return;
  }
  state.currentTeamIndex = (state.currentTeamIndex + 1) % state.teams.length;
  pickNextQuestion();
}

function awardPoints(pts){
  state.teams[state.currentTeamIndex].score += pts;
}

function answerQuizVF(index){
  if(state.qState.revealed) return;
  const {kind, data} = state.currentQ;
  let isCorrect, pts;
  if(kind==='quiz'){
    isCorrect = index === data.correct;
    pts = POINTS.quiz;
  } else {
    const chosenBool = index===0; // 0 = Vero, 1 = Falso
    isCorrect = chosenBool === data.correct;
    pts = POINTS.vf;
  }
  state.qState.selected = index;
  state.qState.revealed = true;
  state.qState.wasCorrect = isCorrect;
  if(isCorrect) awardPoints(pts);
  render();
}

function indovinaAction(action){
  const data = state.currentQ.data;
  if(action==='next'){
    if(state.qState.clueIndex < data.clues.length-1){
      state.qState.clueIndex++;
    }
    render();
    return;
  }
  if(action==='guessed'){
    const pts = POINTS.indovina[state.qState.clueIndex] || 5;
    awardPoints(pts);
    state.qState.revealed = true;
    state.qState.earnedPts = pts;
    render();
    return;
  }
  if(action==='reveal'){
    state.qState.revealed = true;
    state.qState.earnedPts = 0;
    render();
    return;
  }
}

function endGame(){
  state.screen = 'end';
  render();
}

function backToSetup(){
  state.screen = 'setup';
  render();
}

/* =========================================================
   LOGICA MODALITA' PARTY
   ========================================================= */
// Timer per Tabù e Mimare: un semplice intervallo JS che aggiorna il DOM direttamente
// (non passa da render(), per non interrompere lo stato della domanda in corso).
let partyTimerInterval = null;
function clearPartyTimer(){
  if(partyTimerInterval){ clearInterval(partyTimerInterval); partyTimerInterval = null; }
}
function startPartyTimer(){
  clearPartyTimer();
  let remaining = party.timerSeconds;
  const display = document.getElementById('party-timer-display');
  if(display) display.textContent = remaining;
  partyTimerInterval = setInterval(()=>{
    remaining--;
    const el = document.getElementById('party-timer-display');
    if(!el){ clearPartyTimer(); return; } // la schermata e' cambiata: fermiamo il timer
    el.textContent = Math.max(remaining, 0);
    if(remaining <= 10) el.classList.add('timer-low');
    if(remaining <= 0){
      clearPartyTimer();
      const wrap = document.getElementById('party-timer-wrap');
      if(wrap) wrap.classList.add('timer-done');
    }
  }, 1000);
}

function buildPartyTypePools(diff){
  const match = (x) => x.diff === diff;
  return {
    taboo: shuffle(TABOO.filter(match).map(x=>({kind:'taboo',data:x}))),
    charades: shuffle(CHARADES.filter(match).map(x=>({kind:'charades',data:x}))),
    treclues: shuffle(TRECLUES.filter(match).map(x=>({kind:'treclues',data:x}))),
    intruso: shuffle(INTRUSO.filter(match).map(x=>({kind:'intruso',data:x}))),
    errore: shuffle(ERRORE.filter(match).map(x=>({kind:'errore',data:x}))),
  };
}

function startPartyGame(){
  party.teams = [];
  const enabledTypes = ['taboo','charades','treclues','intruso','errore'].filter(t => party.typesEnabled[t]);
  for(let i=0;i<party.numTeams;i++){
    const name = (party.teamNames[i] || '').trim() || ('Squadra '+(i+1));
    const diff = party.teamDifficulties[i] || 'facile';
    party.teams.push({
      name, score:0, color:TEAM_COLORS[i], difficulty:diff, asked:0,
      pools: buildPartyTypePools(diff),
      typeSequence: buildTypeSequence(party.questionsPerTeam, enabledTypes),
    });
  }
  party.currentTeamIndex = 0;
  party.usedTopics = new Set();
  party.askedCount = 0;
  party.autoEnded = false;
  state.screen = 'party-game';
  pickNextPartyItem();
}

function popUnusedPartyItem(pool){
  // Le modalità Party non condividono argomenti fra loro (mimare "Davide e Golia" e indovinare
  // "Davide" al tabù sono esperienze diverse), quindi qui basta non ripetere lo stesso id.
  while(pool && pool.length > 0){
    const candidate = pool.pop();
    if(party.usedTopics.has(candidate.data.id)) continue;
    party.usedTopics.add(candidate.data.id);
    return candidate;
  }
  return null;
}

function pickNextPartyItem(){
  clearPartyTimer();
  party.qState = {revealed:false, selected:null, peeked:false};
  const team = party.teams[party.currentTeamIndex];
  const wantType = team.typeSequence[team.asked];
  let picked = null;

  if(wantType){
    picked = popUnusedPartyItem(team.pools[wantType]);
  }
  if(!picked){
    for(const t of ['taboo','charades','treclues','intruso','errore']){
      if(t === wantType || !party.typesEnabled[t]) continue;
      picked = popUnusedPartyItem(team.pools[t]);
      if(picked) break;
    }
  }

  if(picked){
    party.currentQ = picked;
    party.askedCount++;
    team.asked = (team.asked||0) + 1;
    if(picked.kind === 'intruso'){
      // Mescola l'ordine delle 4 opzioni una sola volta per questa domanda, così
      // l'intruso non finisce sempre nella stessa posizione (era quasi sempre l'ultima).
      const order = shuffle([0,1,2,3]);
      party.qState.shuffledItems = order.map(i => picked.data.items[i]);
      party.qState.shuffledOddIndex = order.indexOf(picked.data.oddIndex);
    }
    if(picked.kind === 'treclues'){
      // Stesso principio: l'indizio falso era sempre il terzo. Mescoliamo l'ordine
      // dei tre indizi una sola volta per questa domanda.
      const order = shuffle([0,1,2]);
      party.qState.shuffledClues = order.map(i => picked.data.clues[i]);
      party.qState.shuffledFalseIndex = order.indexOf(picked.data.falseIndex);
    }
  } else {
    party.currentQ = null;
  }
  render();
}

function reshufflePartyPool(){
  const team = party.teams[party.currentTeamIndex];
  [TABOO,CHARADES,TRECLUES,INTRUSO,ERRORE].forEach(arr=>{
    arr.filter(x=>x.diff===team.difficulty).forEach(x=>party.usedTopics.delete(x.id));
  });
  team.pools = buildPartyTypePools(team.difficulty);
  pickNextPartyItem();
}

function advancePartyTurn(){
  const allDone = party.teams.every(t => (t.asked||0) >= party.questionsPerTeam);
  if(allDone){
    party.autoEnded = true;
    endPartyGame();
    return;
  }
  party.currentTeamIndex = (party.currentTeamIndex + 1) % party.teams.length;
  pickNextPartyItem();
}

function awardPartyPoints(pts){
  party.teams[party.currentTeamIndex].score += pts;
}

// Usata da: Parola Proibita, Mimare, Trova l'Errore - giochi giudicati dal master (host-judged)
function partyJudge(correct){
  if(party.qState.revealed) return;
  clearPartyTimer();
  const kind = party.currentQ.kind;
  const pts = PARTY_POINTS[kind];
  party.qState.revealed = true;
  party.qState.wasCorrect = correct;
  if(correct) awardPartyPoints(pts);
  render();
}

// Usata da: L'intruso biblico (scelta multipla, auto-giudicata)
function partyAnswerIntruso(index){
  if(party.qState.revealed) return;
  const isCorrect = index === party.qState.shuffledOddIndex;
  party.qState.selected = index;
  party.qState.revealed = true;
  party.qState.wasCorrect = isCorrect;
  if(isCorrect) awardPartyPoints(PARTY_POINTS.intruso);
  render();
}

// Usata da: Uno dei tre è falso - il master chiede la risposta a voce, poi conferma
function partyAnswerTreClues(correct){
  if(party.qState.revealed) return;
  const pts = PARTY_POINTS.treclues;
  party.qState.revealed = true;
  party.qState.wasCorrect = correct;
  if(correct) awardPartyPoints(pts);
  render();
}

function endPartyGame(){
  state.screen = 'party-end';
  render();
}

function backToPartySetup(){
  state.screen = 'party-setup';
  render();
}

function goToModeSelect(){
  state.screen = 'mode-select';
  render();
}

/* =========================================================
   RENDER
   ========================================================= */
const app = document.getElementById('app');

function render(){
  if(state.screen==='mode-select') app.innerHTML = renderModeSelect();
  else if(state.screen==='setup') app.innerHTML = renderSetup();
  else if(state.screen==='game') app.innerHTML = renderGame();
  else if(state.screen==='end') app.innerHTML = renderEnd();
  else if(state.screen==='party-setup') app.innerHTML = renderPartySetup();
  else if(state.screen==='party-game') app.innerHTML = renderPartyGame();
  else if(state.screen==='party-end') app.innerHTML = renderPartyEnd();
}

function renderModeSelect(){
  return `
    <div class="tablet" style="text-align:center;">
      <label class="field-label" style="margin-bottom:14px;">Scegli la modalità</label>
      <button class="btn btn-primary" data-action="pick-mode" data-mode="classica" style="margin-bottom:10px;">📖 Versione Classica<br><span style="font-weight:400;font-size:var(--fs-sm);">Quiz, Vero/Falso, Indovina chi sono</span></button>
      <button class="btn btn-primary" data-action="pick-mode" data-mode="party">🎉 Versione Party<br><span style="font-weight:400;font-size:var(--fs-sm);">Tabù, Mimare, Intruso e altri giochi di gruppo</span></button>
    </div>
  `;
}

function renderSetup(){
  const teamRows = Array.from({length:state.numTeams}).map((_,i)=>{
    const diffOpts = DIFF_ORDER.map(d=>`<option value="${d}" ${state.teamDifficulties[i]===d?'selected':''}>${DIFF_LABELS[d]}</option>`).join('');
    return `
    <div class="team-row">
      <span class="team-dot" style="background:${TEAM_COLORS[i]}"></span>
      <input type="text" data-team-index="${i}" value="${(state.teamNames[i]||'').replace(/"/g,'&quot;')}" placeholder="Squadra ${i+1}" maxlength="24">
      <select class="diff-select" data-team-diff-index="${i}" aria-label="Difficoltà per ${state.teamNames[i]||('Squadra '+(i+1))}">${diffOpts}</select>
    </div>
  `;
  }).join('');

  const noTypeSelected = !state.typesEnabled.quiz && !state.typesEnabled.vf && !state.typesEnabled.indovina;

  return `
    <div class="tablet">
      <label class="field-label">Numero di squadre</label>
      <div class="stepper">
        <button data-action="team-dec">−</button>
        <span class="count">${state.numTeams}</span>
        <button data-action="team-inc">+</button>
      </div>

      <label class="field-label">Domande a testa (fine partita automatica)</label>
      <div class="stepper">
        <button data-action="qpt-dec">−</button>
        <span class="count">${state.questionsPerTeam}</span>
        <button data-action="qpt-inc">+</button>
      </div>

      <hr class="section-divider">
      <label class="field-label">Squadre e difficoltà — ogni squadra ha il suo livello</label>
      ${teamRows}
      <p style="font-size:var(--fs-sm);color:var(--ink-soft);margin:2px 0 0;">Base = facilissimo, Ellero 🔥 = domande ultra estreme. I punti guadagnati sono sempre gli stessi, a qualsiasi livello.</p>
    </div>

    <div class="tablet">
      <label class="field-label">Tipi di gioco</label>
      <div class="check-row">
        <input type="checkbox" id="t-quiz" data-action="toggle-type" data-value="quiz" ${state.typesEnabled.quiz?'checked':''}>
        <label for="t-quiz">Quiz a risposta multipla</label>
      </div>
      <div class="check-row">
        <input type="checkbox" id="t-vf" data-action="toggle-type" data-value="vf" ${state.typesEnabled.vf?'checked':''}>
        <label for="t-vf">Vero o Falso</label>
      </div>
      <div class="check-row">
        <input type="checkbox" id="t-indovina" data-action="toggle-type" data-value="indovina" ${state.typesEnabled.indovina?'checked':''}>
        <label for="t-indovina">Indovina chi sono</label>
      </div>
      ${noTypeSelected ? '<div class="warn">Seleziona almeno un tipo di gioco.</div>' : ''}

      <button class="btn btn-primary" data-action="start" ${noTypeSelected?'disabled':''} style="margin-top:14px;">🎬 Inizia la partita</button>
      <button class="link-btn-dark" data-action="mode-select" style="display:block;margin:10px auto 0;">← Cambia modalità di gioco</button>
    </div>
  `;
}

function renderScoreboard(){
  return `<div class="scoreboard">${state.teams.map((t,i)=>`
    <div class="team-pill ${i===state.currentTeamIndex?'active':''}">
      <span class="team-pill-dot" style="background:${t.color}"></span>${t.name}: <b>${t.score}</b>
    </div>
  `).join('')}</div>`;
}

function renderGame(){
  const sb = renderScoreboard();
  const currentTeam = state.teams[state.currentTeamIndex];

  if(!state.currentQ){
    return `
      ${sb}
      <div class="turn-banner">
        <div class="eyebrow">Turno di</div>
        <div class="team-name">${currentTeam.name}</div>
      </div>
      <div class="tablet">
        <p class="empty-note">Il mazzo di domande di livello <b>${DIFF_LABELS[currentTeam.difficulty]}</b> per questa squadra è finito! Puoi rimescolare per continuare a giocare (potrebbero ripresentarsi domande già viste) oppure chiudere qui la partita.</p>
        <button class="btn btn-primary" data-action="reshuffle">🔁 Rimescola e continua</button>
        <button class="btn btn-ghost" data-action="end-game">🏁 Termina la partita</button>
      </div>
    `;
  }

  const {kind, data} = state.currentQ;
  const diffLabel = DIFF_LABELS[data.diff] || data.diff;
  const typeLabel = kind==='quiz' ? 'Quiz' : kind==='vf' ? 'Vero o Falso' : 'Indovina chi sono';

  let body = '';
  if(kind==='quiz'){
    body = renderQuizVF(data, 'quiz');
  } else if(kind==='vf'){
    body = renderQuizVF(data, 'vf');
  } else {
    body = renderIndovina(data);
  }

  return `
    ${sb}
    <div class="turn-banner">
      <div class="eyebrow">Turno di</div>
      <div class="team-name">${currentTeam.name}</div>
    </div>
    <div class="tablet">
      <div class="badges">
        <span class="badge">${typeLabel} · ${diffLabel}</span>
        <span class="progress-note">${currentTeam.asked||0} / ${state.questionsPerTeam}</span>
      </div>
      ${renderPeek(kind, data)}
      ${body}
    </div>
    <div class="footer-actions">
      <button class="link-btn" data-action="end-game">Termina partita</button>
    </div>
  `;
}

function renderPeek(kind, data){
  if(state.qState.revealed) return ''; // già mostrata a tutti, non serve più
  const open = state.qState.peeked;
  let answerText;
  if(kind==='quiz'){
    const letters = ['A','B','C','D'];
    answerText = `${letters[data.correct]}) ${data.opts[data.correct]}`;
  } else if(kind==='vf'){
    answerText = data.correct ? 'Vero' : 'Falso';
  } else {
    answerText = data.answer;
  }
  return `
    <button class="peek-toggle" data-action="toggle-peek">👁️ ${open ? 'Nascondi risposta' : 'Sbircia la risposta (solo per te)'}</button>
    ${open ? `<div class="peek-panel">Risposta esatta: <b>${answerText}</b><br><span class="peek-ref">${data.ref}</span></div>` : ''}
  `;
}

function renderQuizVF(data, kind){
  const opts = kind==='quiz' ? data.opts : ['Vero','Falso'];
  const letters = ['A','B','C','D'];
  const revealed = state.qState.revealed;
  const correctIndex = kind==='quiz' ? data.correct : (data.correct ? 0 : 1);

  const optionsHtml = opts.map((opt,i)=>{
    let cls = 'option';
    if(revealed){
      if(i===correctIndex) cls += ' correct';
      else if(i===state.qState.selected) cls += ' wrong';
    }
    return `<button class="${cls}" data-action="answer" data-index="${i}" ${revealed?'disabled':''}>
      <span class="letter">${letters[i]}</span><span>${opt}</span>
    </button>`;
  }).join('');

  const qText = kind==='quiz' ? data.q : data.s;

  let reveal = '';
  if(revealed){
    const seal = `<div class="seal-wrap"><div class="seal ${state.qState.wasCorrect?'right-s':'wrong-s'}">${state.qState.wasCorrect?'✓':'✕'}</div></div>`;
    const verdict = state.qState.wasCorrect
      ? `<div class="verdict right-v">Corretto!</div>`
      : `<div class="verdict wrong-v">Non proprio.</div>`;
    const answerLine = kind==='quiz'
      ? `La risposta esatta era: <b>${opts[correctIndex]}</b>.`
      : (data.correct ? 'L\'affermazione è vera.' : 'L\'affermazione è falsa.');
    reveal = `
      ${seal}
      <div class="reveal-box">
        ${verdict}
        <div>${answerLine}</div>
        <div class="ref">${data.ref}</div>
      </div>
      <button class="btn btn-primary" data-action="next-question" style="margin-top:14px;">Prossima domanda ▶</button>
    `;
  }

  return `
    <div class="q-text">${qText}</div>
    ${optionsHtml}
    ${reveal}
  `;
}

function renderIndovina(data){
  const idx = state.qState.clueIndex;
  const revealed = state.qState.revealed;
  const cluesShown = data.clues.slice(0, idx+1).map((c,i)=>`<div class="clue-count">Indizio ${i+1}</div><div class="q-text" style="margin-bottom:${i===idx?'18px':'6px'}">${c}</div>`).join('');

  if(revealed){
    const pts = state.qState.earnedPts;
    const seal = `<div class="seal-wrap"><div class="seal ${pts>0?'right-s':'wrong-s'}">${pts>0?'✓':'✕'}</div></div>`;
    return `
      ${cluesShown}
      ${seal}
      <div class="reveal-box">
        <div class="verdict ${pts>0?'right-v':'wrong-v'}">${pts>0 ? ('Indovinato! +'+pts+' punti') : 'Nessuno ha indovinato'}</div>
        <div>La risposta era: <b>${data.answer}</b></div>
        <div class="ref">${data.ref}</div>
      </div>
      <button class="btn btn-primary" data-action="next-question" style="margin-top:14px;">Prossima domanda ▶</button>
    `;
  }

  const hasMoreClues = idx < data.clues.length-1;
  return `
    ${cluesShown}
    <button class="btn btn-primary" data-action="ind-guessed">🎯 Hanno indovinato! (+${POINTS.indovina[idx]||5})</button>
    ${hasMoreClues ? `<button class="btn btn-ghost" data-action="ind-next">➡️ Prossimo indizio</button>` : ''}
    <button class="btn btn-ghost" data-action="ind-reveal">🙅 Nessuno indovina, rivela</button>
  `;
}

function renderEnd(){
  const ranked = state.teams.slice().sort((a,b)=>b.score-a.score);
  const medals = ['🥇','🥈','🥉'];
  const rows = ranked.map((t,i)=>`
    <div class="rank-row">
      <div class="rank-medal">${medals[i] || (i+1)+'.'}</div>
      <div class="rank-name">${t.name}</div>
      <div class="rank-score">${t.score}</div>
    </div>
  `).join('');

  return `
    <div class="tablet">
      <label class="field-label">Classifica finale</label>
      ${state.autoEnded ? `<p class="empty-note" style="margin-top:-4px;">Partita conclusa: ogni squadra ha risposto a ${state.questionsPerTeam} domande! 🎉</p>` : ''}
      ${rows}
      <button class="btn btn-primary" data-action="new-game" style="margin-top:18px;">🔄 Nuova partita</button>
      <button class="link-btn-dark" data-action="mode-select" style="display:block;margin:6px auto 0;">← Cambia modalità di gioco</button>
    </div>
  `;
}

/* =========================================================
   RENDER - MODALITA' PARTY
   ========================================================= */
function renderPartySetup(){
  const teamRows = Array.from({length:party.numTeams}).map((_,i)=>{
    const diffOpts = PARTY_DIFF_ORDER.map(d=>`<option value="${d}" ${party.teamDifficulties[i]===d?'selected':''}>${DIFF_LABELS[d]}</option>`).join('');
    return `
    <div class="team-row">
      <span class="team-dot" style="background:${TEAM_COLORS[i]}"></span>
      <input type="text" data-party-team-index="${i}" value="${(party.teamNames[i]||'').replace(/"/g,'&quot;')}" placeholder="Squadra ${i+1}" maxlength="24">
      <select class="diff-select" data-party-team-diff-index="${i}" aria-label="Difficoltà per ${party.teamNames[i]||('Squadra '+(i+1))}">${diffOpts}</select>
    </div>
  `;
  }).join('');

  const modeKeys = ['taboo','charades','treclues','intruso','errore'];
  const noTypeSelected = modeKeys.every(k => !party.typesEnabled[k]);

  return `
    <div class="tablet">
      <label class="field-label">Numero di squadre</label>
      <div class="stepper">
        <button data-action="pteam-dec">−</button>
        <span class="count">${party.numTeams}</span>
        <button data-action="pteam-inc">+</button>
      </div>

      <label class="field-label">Domande a testa (fine partita automatica)</label>
      <div class="stepper">
        <button data-action="pqpt-dec">−</button>
        <span class="count">${party.questionsPerTeam}</span>
        <button data-action="pqpt-inc">+</button>
      </div>

      <label class="field-label">Timer per Tabù e Mimare (secondi)</label>
      <div class="stepper">
        <button data-action="ptimer-dec">−</button>
        <span class="count">${party.timerSeconds}</span>
        <button data-action="ptimer-inc">+</button>
      </div>

      <hr class="section-divider">
      <label class="field-label">Squadre e difficoltà</label>
      ${teamRows}
    </div>

    <div class="tablet">
      <label class="field-label">Mini-giochi da includere</label>
      ${modeKeys.map(k => `
        <div class="check-row">
          <input type="checkbox" id="pt-${k}" data-action="ptoggle-type" data-value="${k}" ${party.typesEnabled[k]?'checked':''}>
          <label for="pt-${k}">${PARTY_MODE_SVG[k]} ${PARTY_MODE_LABELS[k]}</label>
        </div>
      `).join('')}
      ${noTypeSelected ? '<div class="warn">Seleziona almeno un mini-gioco.</div>' : ''}

      <button class="btn btn-primary" data-action="party-start" ${noTypeSelected?'disabled':''} style="margin-top:14px;">🎬 Inizia la partita</button>
      <button class="link-btn-dark" data-action="mode-select" style="display:block;margin:10px auto 0;">← Cambia modalità di gioco</button>
    </div>
  `;
}

function renderPartyScoreboard(){
  return `<div class="scoreboard">${party.teams.map((t,i)=>`
    <div class="team-pill ${i===party.currentTeamIndex?'active':''}">
      <span class="team-pill-dot" style="background:${t.color}"></span>${t.name}: <b>${t.score}</b>
    </div>
  `).join('')}</div>`;
}

function renderPartyGame(){
  const sb = renderPartyScoreboard();
  const currentTeam = party.teams[party.currentTeamIndex];

  if(!party.currentQ){
    return `
      ${sb}
      <div class="turn-banner">
        <div class="eyebrow">Turno di</div>
        <div class="team-name">${currentTeam.name}</div>
      </div>
      <div class="tablet">
        <p class="empty-note">Il mazzo di livello <b>${DIFF_LABELS[currentTeam.difficulty]}</b> per questa squadra è finito! Puoi rimescolare per continuare (potrebbero ripresentarsi prove già viste) oppure chiudere qui la partita.</p>
        <button class="btn btn-primary" data-action="party-reshuffle">🔁 Rimescola e continua</button>
        <button class="btn btn-ghost" data-action="party-end-game">🏁 Termina la partita</button>
      </div>
    `;
  }

  const {kind, data} = party.currentQ;
  const diffLabel = DIFF_LABELS[data.diff] || data.diff;

  let body = '';
  if(kind==='taboo') body = renderPartyTaboo(data);
  else if(kind==='charades') body = renderPartyCharades(data);
  else if(kind==='treclues') body = renderPartyTreClues(data);
  else if(kind==='intruso') body = renderPartyIntruso(data);
  else if(kind==='errore') body = renderPartyErrore(data);

  return `
    ${sb}
    <div class="turn-banner">
      <div class="eyebrow">Turno di</div>
      <div class="team-name">${currentTeam.name}</div>
    </div>
    <div class="tablet">
      <div class="badges">
        <span class="badge">${PARTY_MODE_SVG[kind]} ${PARTY_MODE_LABELS[kind]} · ${diffLabel}</span>
        <span class="progress-note">${currentTeam.asked||0} / ${party.questionsPerTeam}</span>
      </div>
      ${body}
    </div>
    <div class="footer-actions">
      <button class="link-btn" data-action="party-end-game">Termina partita</button>
    </div>
  `;
}

function renderPartyTaboo(data){
  const revealed = party.qState.revealed;
  if(!revealed){
    return `
      <p style="font-size:var(--fs-base);color:var(--ink-soft);margin:0 0 10px;">Un giocatore della squadra guarda lo schermo e descrive la parola ai compagni, SENZA usare le parole vietate. Gli altri indovinano a voce.</p>
      <div class="q-text" style="margin-bottom:4px;">Da far indovinare:</div>
      <div class="q-text" style="font-size:var(--fs-xl);color:var(--gold-deep);margin-bottom:var(--sp-4);">${data.word}</div>
      <div class="clue-count">Parole vietate</div>
      <div class="reveal-box" style="border-color:var(--wrong);background:rgba(192,92,92,.08);">
        ${data.taboo.map(w=>`<div>🚫 ${w}</div>`).join('')}
      </div>
      ${renderPartyTimer()}
      <div class="actions-row" style="margin-top:14px;flex-direction:column;gap:9px;">
        <button class="btn btn-primary" data-action="party-judge" data-correct="1">✅ Hanno indovinato (+${PARTY_POINTS.taboo})</button>
        <button class="btn btn-ghost" data-action="party-judge" data-correct="0">⏭️ Passo / tempo scaduto</button>
      </div>
    `;
  }
  return renderPartyOutcome(party.qState.wasCorrect, `La parola era: <b>${data.word}</b>`);
}

function renderPartyCharades(data){
  const revealed = party.qState.revealed;
  if(!revealed){
    return `
      <p style="font-size:var(--fs-base);color:var(--ink-soft);margin:0 0 10px;">Un giocatore della squadra mima la scena SENZA parlare. Gli altri indovinano a voce.</p>
      <div class="q-text" style="margin-bottom:4px;">Mima questo:</div>
      <div class="q-text" style="font-size:var(--fs-lg);color:var(--gold-deep);">${data.prompt}</div>
      ${renderPartyTimer()}
      <div class="actions-row" style="margin-top:16px;flex-direction:column;gap:9px;">
        <button class="btn btn-primary" data-action="party-judge" data-correct="1">✅ Hanno indovinato (+${PARTY_POINTS.charades})</button>
        <button class="btn btn-ghost" data-action="party-judge" data-correct="0">⏭️ Passo / tempo scaduto</button>
      </div>
    `;
  }
  return renderPartyOutcome(party.qState.wasCorrect, `La scena era: <b>${data.prompt}</b>`);
}

function renderPartyTreClues(data){
  const revealed = party.qState.revealed;
  const clues = party.qState.shuffledClues || data.clues;
  const falseIndex = party.qState.shuffledClues ? party.qState.shuffledFalseIndex : data.falseIndex;
  const cluesHtml = clues.map((c,i)=>`
    <div class="option-static${revealed && i===falseIndex ? ' wrong' : ''}">
      <span class="letter">${i+1}</span><span>${c}${revealed && i===falseIndex ? ' <b>(falso)</b>' : ''}</span>
    </div>
  `).join('');
  if(!revealed){
    return `
      <p style="font-size:var(--fs-base);color:var(--ink-soft);margin:0 0 10px;">Leggi i tre indizi ad alta voce: due sono veri, uno è falso. La squadra deve indovinare CHI è, a voce.</p>
      ${renderPartyPeek('treclues', data)}
      ${cluesHtml}
      <div class="actions-row" style="margin-top:14px;flex-direction:column;gap:9px;">
        <button class="btn btn-primary" data-action="party-treclues" data-correct="1">✅ Hanno indovinato (+${PARTY_POINTS.treclues})</button>
        <button class="btn btn-ghost" data-action="party-treclues" data-correct="0">❌ Non hanno indovinato</button>
      </div>
    `;
  }
  return `
    ${cluesHtml}
    ${renderPartyOutcome(party.qState.wasCorrect, `La risposta era: <b>${data.answer}</b>`)}
  `;
}

function renderPartyIntruso(data){
  const revealed = party.qState.revealed;
  const letters = ['A','B','C','D'];
  const items = party.qState.shuffledItems || data.items;
  const oddIndex = party.qState.shuffledItems ? party.qState.shuffledOddIndex : data.oddIndex;
  const optionsHtml = items.map((item,i)=>{
    let cls = 'option';
    if(revealed){
      if(i===oddIndex) cls += ' correct';
      else if(i===party.qState.selected) cls += ' wrong';
    }
    return `<button class="${cls}" data-action="party-intruso" data-index="${i}" ${revealed?'disabled':''}>
      <span class="letter">${letters[i]}</span><span>${item}</span>
    </button>`;
  }).join('');

  let reveal = '';
  if(revealed){
    reveal = `
      ${renderPartyOutcome(party.qState.wasCorrect, `L'intruso era: <b>${items[oddIndex]}</b>`, false)}
      <div class="reveal-box" style="margin-top:-4px;">${data.explanation}</div>
      <button class="btn btn-primary" data-action="party-next" style="margin-top:14px;">Prossima prova ▶</button>
    `;
  }
  return `
    <p style="font-size:var(--fs-base);color:var(--ink-soft);margin:0 0 10px;">Quale dei quattro non appartiene al gruppo?</p>
    ${renderPartyPeek('intruso', data)}
    ${optionsHtml}
    ${reveal}
  `;
}

function renderPartyErrore(data){
  const revealed = party.qState.revealed;
  if(!revealed){
    return `
      <p style="font-size:var(--fs-base);color:var(--ink-soft);margin:0 0 10px;">Leggi il racconto ad alta voce: c'è un errore nascosto. La squadra deve trovarlo a voce.</p>
      ${renderPartyPeek('errore', data)}
      <div class="q-text">"${data.story}"</div>
      <div class="actions-row" style="margin-top:16px;flex-direction:column;gap:9px;">
        <button class="btn btn-primary" data-action="party-judge" data-correct="1">✅ Hanno trovato l'errore (+${PARTY_POINTS.errore})</button>
        <button class="btn btn-ghost" data-action="party-judge" data-correct="0">❌ Non l'hanno trovato</button>
      </div>
    `;
  }
  return `
    <div class="q-text" style="font-size:var(--fs-base);opacity:.7;">"${data.story}"</div>
    ${renderPartyOutcome(party.qState.wasCorrect, data.correction)}
  `;
}

function renderPartyTimer(){
  return `
    <div class="timer-wrap" id="party-timer-wrap">
      <span class="timer-display" id="party-timer-display">${party.timerSeconds}</span>
      <span class="timer-unit">sec</span>
      <button class="btn timer-start-btn" data-action="party-timer-start">▶️ Avvia</button>
    </div>
  `;
}

function renderPartyOutcome(wasCorrect, message, showButton=true){
  const seal = `<div class="seal-wrap"><div class="seal ${wasCorrect?'right-s':'wrong-s'}">${wasCorrect?'✓':'✕'}</div></div>`;
  const verdict = wasCorrect ? `<div class="verdict right-v">Corretto!</div>` : `<div class="verdict wrong-v">Non questa volta.</div>`;
  return `
    ${seal}
    <div class="reveal-box">
      ${verdict}
      <div>${message}</div>
    </div>
    ${showButton ? `<button class="btn btn-primary" data-action="party-next" style="margin-top:14px;">Prossima prova ▶</button>` : ''}
  `;
}

function renderPartyEnd(){
  const ranked = party.teams.slice().sort((a,b)=>b.score-a.score);
  const medals = ['🥇','🥈','🥉'];
  const rows = ranked.map((t,i)=>`
    <div class="rank-row">
      <div class="rank-medal">${medals[i] || (i+1)+'.'}</div>
      <div class="rank-name">${t.name}</div>
      <div class="rank-score">${t.score}</div>
    </div>
  `).join('');

  return `
    <div class="tablet">
      <label class="field-label">Classifica finale</label>
      ${party.autoEnded ? `<p class="empty-note" style="margin-top:-4px;">Partita conclusa: ogni squadra ha risposto a ${party.questionsPerTeam} prove! 🎉</p>` : ''}
      ${rows}
      <button class="btn btn-primary" data-action="party-new-game" style="margin-top:18px;">🔄 Nuova partita</button>
      <button class="link-btn-dark" data-action="mode-select" style="display:block;margin:6px auto 0;">← Cambia modalità di gioco</button>
    </div>
  `;
}

/* =========================================================
   EVENTS
   ========================================================= */
app.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='team-inc'){ state.numTeams = Math.min(6, state.numTeams+1); render(); }
  else if(action==='team-dec'){ state.numTeams = Math.max(2, state.numTeams-1); render(); }
  else if(action==='qpt-inc'){ state.questionsPerTeam = Math.min(30, state.questionsPerTeam+1); render(); }
  else if(action==='qpt-dec'){ state.questionsPerTeam = Math.max(3, state.questionsPerTeam-1); render(); }
  else if(action==='toggle-type'){ state.typesEnabled[el.dataset.value] = !state.typesEnabled[el.dataset.value]; render(); }
  else if(action==='start'){ startGame(); }
  else if(action==='answer'){ answerQuizVF(parseInt(el.dataset.index,10)); }
  else if(action==='toggle-peek'){ state.qState.peeked = !state.qState.peeked; render(); }
  else if(action==='ind-next'){ indovinaAction('next'); }
  else if(action==='ind-guessed'){ indovinaAction('guessed'); }
  else if(action==='ind-reveal'){ indovinaAction('reveal'); }
  else if(action==='next-question'){ advanceTurn(); }
  else if(action==='reshuffle'){ reshufflePool(); }
  else if(action==='end-game'){ endGame(); }
  else if(action==='new-game'){ backToSetup(); }
  else if(action==='mode-select'){ goToModeSelect(); }
  else if(action==='pick-mode'){
    state.gameMode = el.dataset.mode;
    state.screen = el.dataset.mode==='party' ? 'party-setup' : 'setup';
    render();
  }
  // --- Modalita' Party ---
  else if(action==='pteam-inc'){ party.numTeams = Math.min(6, party.numTeams+1); render(); }
  else if(action==='pteam-dec'){ party.numTeams = Math.max(2, party.numTeams-1); render(); }
  else if(action==='pqpt-inc'){ party.questionsPerTeam = Math.min(30, party.questionsPerTeam+1); render(); }
  else if(action==='pqpt-dec'){ party.questionsPerTeam = Math.max(3, party.questionsPerTeam-1); render(); }
  else if(action==='ptimer-inc'){ party.timerSeconds = Math.min(180, party.timerSeconds+10); render(); }
  else if(action==='ptimer-dec'){ party.timerSeconds = Math.max(20, party.timerSeconds-10); render(); }
  else if(action==='party-timer-start'){ startPartyTimer(); }
  else if(action==='party-toggle-peek'){ party.qState.peeked = !party.qState.peeked; render(); }
  else if(action==='ptoggle-type'){ party.typesEnabled[el.dataset.value] = !party.typesEnabled[el.dataset.value]; render(); }
  else if(action==='party-start'){ startPartyGame(); }
  else if(action==='party-judge'){ partyJudge(el.dataset.correct==='1'); }
  else if(action==='party-treclues'){ partyAnswerTreClues(el.dataset.correct==='1'); }
  else if(action==='party-intruso'){ partyAnswerIntruso(parseInt(el.dataset.index,10)); }
  else if(action==='party-next'){ advancePartyTurn(); }
  else if(action==='party-reshuffle'){ reshufflePartyPool(); }
  else if(action==='party-end-game'){ endPartyGame(); }
  else if(action==='party-new-game'){ backToPartySetup(); }
});

app.addEventListener('input', (e)=>{
  const el = e.target;
  if(el.dataset && el.dataset.teamIndex !== undefined){
    state.teamNames[parseInt(el.dataset.teamIndex,10)] = el.value;
  }
  if(el.dataset && el.dataset.partyTeamIndex !== undefined){
    party.teamNames[parseInt(el.dataset.partyTeamIndex,10)] = el.value;
  }
});

app.addEventListener('change', (e)=>{
  const el = e.target;
  if(el.dataset && el.dataset.teamDiffIndex !== undefined){
    state.teamDifficulties[parseInt(el.dataset.teamDiffIndex,10)] = el.value;
  }
  if(el.dataset && el.dataset.partyTeamDiffIndex !== undefined){
    party.teamDifficulties[parseInt(el.dataset.partyTeamDiffIndex,10)] = el.value;
  }
});

render();
</script>
</body>
</html>
